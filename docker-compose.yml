version: '3.8'

services:
  orbit-overload:
    build: .
    container_name: orbit-overload-app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NASA_API_KEY=${NASA_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ID=${JWT_ID}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
