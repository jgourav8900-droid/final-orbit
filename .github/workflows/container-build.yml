name: Container build

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - Dockerfile
      - requirements.txt
      - backend/**
      - migrations/**
      - run_server.py
      - .github/workflows/container-build.yml
  pull_request:
    paths:
      - .dockerignore
      - Dockerfile
      - requirements.txt
      - backend/**
      - migrations/**
      - run_server.py
      - .github/workflows/container-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: final-orbit:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
